name: Bundle Size Check

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/**/*.ts'
      - 'apps/**/*.tsx'
      - 'apps/**/*.js'
      - 'apps/**/*.jsx'
      - 'packages/**/*.ts'
      - 'pnpm-lock.yaml'

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8.15.0'

jobs:
  bundle-check:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build all packages
        run: pnpm build

      - name: Check bundle sizes
        run: npx bundlesize
        env:
          BUNDLESIZE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report bundle sizes
        if: always()
        run: |
          echo "## Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Game Frontend" >> $GITHUB_STEP_SUMMARY
          if [ -d "apps/game/frontend/dist" ]; then
            du -sh apps/game/frontend/dist || echo "No dist folder"
            echo '```' >> $GITHUB_STEP_SUMMARY
            ls -lh apps/game/frontend/dist/assets/*.js 2>/dev/null | awk '{print $5, $9}' >> $GITHUB_STEP_SUMMARY || echo "No JS files"
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Website" >> $GITHUB_STEP_SUMMARY
          if [ -d "apps/website/.next" ]; then
            du -sh apps/website/.next || echo "No .next folder"
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Admin" >> $GITHUB_STEP_SUMMARY
          if [ -d "apps/admin/.next" ]; then
            du -sh apps/admin/.next || echo "No .next folder"
          fi
