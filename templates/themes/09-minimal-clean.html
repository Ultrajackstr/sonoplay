<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Clean - SonoPlex Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* ============================================
           MINIMAL CLEAN THEME
           Inspired by: Notion, Linear, Apple HIG
           Philosophy: Content over chrome, clarity through restraint
           ============================================ */

        :root {
            /* Core palette - warm whites, not clinical */
            --bg-primary: #fafaf9;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f5f5f4;
            --bg-hover: #e7e5e4;
            
            /* Text hierarchy */
            --text-primary: #1c1917;
            --text-secondary: #57534e;
            --text-tertiary: #a8a29e;
            
            /* Accent - single, purposeful blue */
            --accent: #2563eb;
            --accent-soft: #dbeafe;
            --accent-hover: #1d4ed8;
            
            /* Status colors - muted, not alarming */
            --success: #16a34a;
            --success-soft: #dcfce7;
            --warning: #ca8a04;
            --warning-soft: #fef9c3;
            --danger: #dc2626;
            --danger-soft: #fee2e2;
            
            /* Borders and shadows - barely there */
            --border: #e7e5e4;
            --border-strong: #d6d3d1;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
            --shadow-lg: 0 12px 32px rgba(0,0,0,0.08);
            
            /* Spacing scale */
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 16px;
            --space-lg: 24px;
            --space-xl: 32px;
            --space-2xl: 48px;
            
            /* Border radius - subtle, not bubbly */
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-full: 9999px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
        }

        /* ============================================
           LAYOUT
           ============================================ */

        .app {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .main-content {
            flex: 1;
            padding: var(--space-md);
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        @media (min-width: 768px) {
            .main-content {
                padding: var(--space-xl);
            }
        }

        /* ============================================
           NAVIGATION
           ============================================ */

        .nav {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 0 var(--space-md);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 56px;
        }

        @media (min-width: 768px) {
            .nav {
                padding: 0 var(--space-xl);
            }
            .nav-inner {
                height: 64px;
            }
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            font-weight: 600;
            font-size: 1rem;
            color: var(--text-primary);
            text-decoration: none;
        }

        .nav-brand-icon {
            width: 28px;
            height: 28px;
            background: var(--accent);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-brand-icon svg {
            width: 16px;
            height: 16px;
            color: white;
        }

        .nav-links {
            display: flex;
            gap: var(--space-xs);
            background: var(--bg-tertiary);
            padding: 3px;
            border-radius: var(--radius-md);
        }

        .nav-link {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-decoration: none;
            padding: var(--space-sm) var(--space-md);
            border-radius: calc(var(--radius-md) - 2px);
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            gap: var(--space-sm);
        }

        .nav-link:hover {
            color: var(--text-primary);
        }

        .nav-link.active {
            background: var(--bg-secondary);
            color: var(--text-primary);
            box-shadow: var(--shadow-sm);
        }

        .nav-link svg {
            width: 16px;
            height: 16px;
            opacity: 0.7;
        }

        /* Mobile nav - hide text, show icons only */
        @media (max-width: 480px) {
            .nav-link span {
                display: none;
            }
            .nav-link {
                padding: var(--space-sm) 12px;
            }
        }

        /* ============================================
           PAGE HEADER
           ============================================ */

        .page-header {
            margin-bottom: var(--space-lg);
        }

        @media (min-width: 768px) {
            .page-header {
                display: flex;
                align-items: flex-end;
                justify-content: space-between;
                margin-bottom: var(--space-xl);
            }
        }

        .page-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            margin-bottom: var(--space-xs);
        }

        @media (min-width: 768px) {
            .page-title {
                font-size: 1.75rem;
            }
        }

        .page-subtitle {
            font-size: 0.9375rem;
            color: var(--text-secondary);
        }

        /* Search */
        .search-box {
            margin-top: var(--space-md);
            position: relative;
        }

        @media (min-width: 768px) {
            .search-box {
                margin-top: 0;
                width: 280px;
            }
        }

        .search-input {
            width: 100%;
            padding: 10px 14px 10px 40px;
            font-size: 0.9375rem;
            font-family: inherit;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: var(--bg-secondary);
            color: var(--text-primary);
            transition: all 0.15s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .search-input::placeholder {
            color: var(--text-tertiary);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            color: var(--text-tertiary);
            pointer-events: none;
        }

        /* ============================================
           DEVICE CARDS
           ============================================ */

        .device-grid {
            display: grid;
            gap: var(--space-md);
        }

        @media (min-width: 640px) {
            .device-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 1024px) {
            .device-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .device-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: var(--space-lg);
            transition: all 0.2s ease;
        }

        .device-card:hover {
            border-color: var(--border-strong);
            box-shadow: var(--shadow-md);
        }

        .device-card.playing {
            border-color: var(--accent);
            background: linear-gradient(to bottom, var(--accent-soft), var(--bg-secondary));
        }

        .device-header {
            display: flex;
            align-items: flex-start;
            gap: var(--space-md);
            margin-bottom: var(--space-md);
        }

        .device-icon {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-md);
            background: var(--bg-tertiary);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .device-icon svg {
            width: 22px;
            height: 22px;
            color: var(--text-secondary);
        }

        .device-card.playing .device-icon {
            background: var(--accent);
        }

        .device-card.playing .device-icon svg {
            color: white;
        }

        .device-info {
            flex: 1;
            min-width: 0;
        }

        .device-name {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .device-type {
            font-size: 0.8125rem;
            color: var(--text-tertiary);
        }

        .device-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            font-weight: 500;
            padding: 4px 10px;
            border-radius: var(--radius-full);
            margin-top: var(--space-sm);
        }

        .device-status.online {
            background: var(--success-soft);
            color: var(--success);
        }

        .device-status.playing {
            background: var(--accent-soft);
            color: var(--accent);
        }

        .device-status.offline {
            background: var(--bg-tertiary);
            color: var(--text-tertiary);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }

        .device-status.playing .status-dot {
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Now Playing Info */
        .now-playing {
            margin-top: var(--space-md);
            padding-top: var(--space-md);
            border-top: 1px solid var(--border);
        }

        .now-playing-label {
            font-size: 0.6875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-tertiary);
            margin-bottom: var(--space-sm);
        }

        .now-playing-track {
            font-size: 0.9375rem;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .now-playing-artist {
            font-size: 0.8125rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .progress-bar {
            margin-top: var(--space-md);
            height: 4px;
            background: var(--bg-tertiary);
            border-radius: var(--radius-full);
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            border-radius: var(--radius-full);
            transition: width 0.3s ease;
        }

        .progress-time {
            display: flex;
            justify-content: space-between;
            margin-top: var(--space-sm);
            font-size: 0.75rem;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-tertiary);
        }

        /* Device Controls */
        .device-controls {
            display: flex;
            gap: var(--space-sm);
            margin-top: var(--space-md);
        }

        .control-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-sm);
            padding: 10px var(--space-md);
            font-size: 0.8125rem;
            font-weight: 500;
            font-family: inherit;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: var(--bg-secondary);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .control-btn:hover {
            border-color: var(--border-strong);
            color: var(--text-primary);
            background: var(--bg-tertiary);
        }

        .control-btn svg {
            width: 16px;
            height: 16px;
        }

        .control-btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        .control-btn.primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }

        /* Playback controls for playing device */
        .playback-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-sm);
            margin-top: var(--space-md);
        }

        .playback-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 50%;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .playback-btn:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .playback-btn svg {
            width: 20px;
            height: 20px;
        }

        .playback-btn.main {
            width: 48px;
            height: 48px;
            background: var(--accent);
            color: white;
        }

        .playback-btn.main:hover {
            background: var(--accent-hover);
            transform: scale(1.05);
        }

        .playback-btn.main svg {
            width: 24px;
            height: 24px;
        }

        /* ============================================
           EMPTY STATE
           ============================================ */

        .empty-state {
            text-align: center;
            padding: var(--space-2xl) var(--space-lg);
            background: var(--bg-secondary);
            border: 1px dashed var(--border);
            border-radius: var(--radius-lg);
        }

        .empty-state-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto var(--space-md);
            color: var(--text-tertiary);
        }

        .empty-state-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: var(--space-sm);
        }

        .empty-state-text {
            font-size: 0.9375rem;
            color: var(--text-secondary);
            max-width: 320px;
            margin: 0 auto;
        }

        /* ============================================
           SVG ICONS (inline for demo)
           ============================================ */
    </style>
</head>
<body>
    <div class="app">
        <!-- Navigation -->
        <nav class="nav">
            <div class="nav-inner">
                <a href="#" class="nav-brand">
                    <div class="nav-brand-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="5 3 19 12 5 21 5 3"></polygon>
                        </svg>
                    </div>
                    <span>SonoPlex</span>
                </a>
                <div class="nav-links">
                    <a href="#" class="nav-link active">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                            <polyline points="17 2 12 7 7 2"></polyline>
                        </svg>
                        <span>Devices</span>
                    </a>
                    <a href="#" class="nav-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="7" height="7"></rect>
                            <rect x="14" y="3" width="7" height="7"></rect>
                            <rect x="14" y="14" width="7" height="7"></rect>
                            <rect x="3" y="14" width="7" height="7"></rect>
                        </svg>
                        <span>Groups</span>
                    </a>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Page Header -->
            <header class="page-header">
                <div>
                    <h1 class="page-title">Discovered Devices</h1>
                    <p class="page-subtitle">4 devices on your network</p>
                </div>
                <div class="search-box">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                    <input type="text" class="search-input" placeholder="Search devices...">
                </div>
            </header>

            <!-- Device Grid -->
            <div class="device-grid">
                <!-- Playing Device -->
                <div class="device-card playing">
                    <div class="device-header">
                        <div class="device-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                                <polyline points="17 2 12 7 7 2"></polyline>
                            </svg>
                        </div>
                        <div class="device-info">
                            <div class="device-name">Living Room TV</div>
                            <div class="device-type">Samsung Smart TV</div>
                            <div class="device-status playing">
                                <span class="status-dot"></span>
                                Now Playing
                            </div>
                        </div>
                    </div>
                    
                    <div class="now-playing">
                        <div class="now-playing-label">Now Playing</div>
                        <div class="now-playing-track">Bohemian Rhapsody</div>
                        <div class="now-playing-artist">Queen</div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: 45%"></div>
                        </div>
                        <div class="progress-time">
                            <span>2:41</span>
                            <span>5:55</span>
                        </div>
                    </div>

                    <div class="playback-controls">
                        <button class="playback-btn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="19 20 9 12 19 4 19 20"></polygon>
                                <line x1="5" y1="19" x2="5" y2="5"></line>
                            </svg>
                        </button>
                        <button class="playback-btn main">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="6" y="4" width="4" height="16"></rect>
                                <rect x="14" y="4" width="4" height="16"></rect>
                            </svg>
                        </button>
                        <button class="playback-btn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="5 4 15 12 5 20 5 4"></polygon>
                                <line x1="19" y1="5" x2="19" y2="19"></line>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Online Device -->
                <div class="device-card">
                    <div class="device-header">
                        <div class="device-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"></circle>
                                <polygon points="10 8 16 12 10 16 10 8"></polygon>
                            </svg>
                        </div>
                        <div class="device-info">
                            <div class="device-name">Kitchen Sonos</div>
                            <div class="device-type">Sonos One</div>
                            <div class="device-status online">
                                <span class="status-dot"></span>
                                Ready
                            </div>
                        </div>
                    </div>
                    <div class="device-controls">
                        <button class="control-btn primary">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="5 3 19 12 5 21 5 3"></polygon>
                            </svg>
                            Play
                        </button>
                        <button class="control-btn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="1"></circle>
                                <circle cx="19" cy="12" r="1"></circle>
                                <circle cx="5" cy="12" r="1"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Online Device 2 -->
                <div class="device-card">
                    <div class="device-header">
                        <div class="device-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                                <polyline points="17 2 12 7 7 2"></polyline>
                            </svg>
                        </div>
                        <div class="device-info">
                            <div class="device-name">Bedroom Chromecast</div>
                            <div class="device-type">Chromecast Audio</div>
                            <div class="device-status online">
                                <span class="status-dot"></span>
                                Ready
                            </div>
                        </div>
                    </div>
                    <div class="device-controls">
                        <button class="control-btn primary">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="5 3 19 12 5 21 5 3"></polygon>
                            </svg>
                            Play
                        </button>
                        <button class="control-btn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="1"></circle>
                                <circle cx="19" cy="12" r="1"></circle>
                                <circle cx="5" cy="12" r="1"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Offline Device -->
                <div class="device-card">
                    <div class="device-header">
                        <div class="device-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                                <polyline points="17 2 12 7 7 2"></polyline>
                            </svg>
                        </div>
                        <div class="device-info">
                            <div class="device-name">Office Monitor</div>
                            <div class="device-type">LG UltraWide</div>
                            <div class="device-status offline">
                                <span class="status-dot"></span>
                                Offline
                            </div>
                        </div>
                    </div>
                    <div class="device-controls">
                        <button class="control-btn" disabled style="opacity: 0.5; cursor: not-allowed;">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path>
                                <path d="M21 3v5h-5"></path>
                            </svg>
                            Reconnect
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
