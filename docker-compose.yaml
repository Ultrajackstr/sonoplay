services:
  sonoplay:
    build: .
    container_name: sonoplay
    network_mode: host
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    env_file:
      - path: .env
        required: false
    volumes:
      - sonoplay-config:/config

volumes:
  sonoplay-config:
